<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relógio Digital</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .clock-wrap {
    text-align: center;
    color: #f1efe8;
    padding: 40px;
  }
  .date {
    font-size: 16px;
    color: #b4b2a9;
    margin-bottom: 8px;
    text-transform: capitalize;
    letter-spacing: 0.5px;
  }
  .time {
    font-size: 88px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }
  .time .sec {
    font-size: 40px;
    color: #78766f;
    margin-left: 8px;
  }
  .ampm {
    font-size: 28px;
    color: #7f77dd;
    margin-left: 12px;
    vertical-align: middle;
  }
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  button {
    background: transparent;
    border: 1px solid #444441;
    color: #b4b2a9;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button.active {
    background: #f1efe8;
    color: #1c1c1a;
    border-color: #f1efe8;
  }
  @media (max-width: 480px) {
    .time { font-size: 56px; }
    .time .sec { font-size: 26px; }
    .ampm { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="clock-wrap">
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
  <div class="controls">
    <button id="btn24" class="active">24h</button>
    <button id="btn12">12h</button>
  </div>
</div>

<script>
let format24 = true;

const diasSemana = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function pad(n) { return n.toString().padStart(2, '0'); }

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  let hourDisplay, ampm = '';
  if (format24) {
    hourDisplay = pad(h);
  } else {
    const h12 = h % 12 === 0 ? 12 : h % 12;
    hourDisplay = pad(h12);
    ampm = h < 12 ? 'AM' : 'PM';
  }

  document.getElementById('time').innerHTML =
    `${hourDisplay}:${pad(m)}<span class="sec">${pad(s)}</span>${ampm ? `<span class="ampm">${ampm}</span>` : ''}`;

  document.getElementById('date').textContent =
    `${diasSemana[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;
}

document.getElementById('btn24').addEventListener('click', () => {
  format24 = true;
  document.getElementById('btn24').classList.add('active');
  document.getElementById('btn12').classList.remove('active');
  updateClock();
});
document.getElementById('btn12').addEventListener('click', () => {
  format24 = false;
  document.getElementById('btn12').classList.add('active');
  document.getElementById('btn24').classList.remove('active');
  updateClock();
});

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
