<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio Digital</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .clock-wrap {
    text-align: center;
    color: #f1efe8;
    padding: 40px;
  }
  .date {
    font-size: 16px;
    color: #b4b2a9;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .time {
    font-size: 88px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }
  .time .sec {
    font-size: 40px;
    color: #78766f;
    margin-left: 8px;
  }
  .ampm {
    font-size: 28px;
    color: #7f77dd;
    margin-left: 12px;
    vertical-align: middle;
  }
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  button {
    background: transparent;
    border: 1px solid #444441;
    color: #b4b2a9;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  button.active {
    background: #f1efe8;
    color: #1c1c1a;
    border-color: #f1efe8;
  }
  @media (max-width: 480px) {
    .time { font-size: 56px; }
    .time .sec { font-size: 26px; }
    .ampm { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="clock-wrap">
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
  <div class="controls">
    <button id="btn24" class="active" aria-pressed="true">24h</button>
    <button id="btn12" aria-pressed="false">12h</button>
  </div>
</div>

<script>
let format24 = true;

const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');
const btn24 = document.getElementById('btn24');
const btn12 = document.getElementById('btn12');

function pad(n) { return n.toString().padStart(2, '0'); }

function updateClock() {
  const now = new Date();
  const h = now.getHours();

  let hourDisplay, ampm = '';
  if (format24) {
    hourDisplay = pad(h);
  } else {
    hourDisplay = pad(h % 12 === 0 ? 12 : h % 12);
    ampm = h < 12 ? 'AM' : 'PM';
  }

  timeEl.innerHTML =
    `${hourDisplay}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>` +
    (ampm ? `<span class="ampm">${ampm}</span>` : '');

  // "sábado, 19 de setembro de 2026" -> só a primeira letra em maiúscula
  const data = now.toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  dateEl.textContent = data.charAt(0).toUpperCase() + data.slice(1);
}

function setFormat(is24) {
  format24 = is24;
  btn24.classList.toggle('active', is24);
  btn12.classList.toggle('active', !is24);
  btn24.setAttribute('aria-pressed', is24);
  btn12.setAttribute('aria-pressed', !is24);
  updateClock();
}

btn24.addEventListener('click', () => setFormat(true));
btn12.addEventListener('click', () => setFormat(false));

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
